name: Build disk images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      title:
        description: "Release title"
        required: true
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      upload-to-sf:
        description: "Upload to SourceForge"
        required: false
        default: false
        type: boolean
      gpu:
        description: "GPU variant"
        required: true
        default: amd
        type: choice
        options:
          - amd
          - nvidia
          - nvidia-open
      platform:
        description: "Target architecture"
        required: true
        type: choice
        options:
          - amd64
          - arm64

  pull_request:
    branches:
      - main
    paths:
      - "Containerfile.iso"
      - ".github/workflows/build-disk.yml"

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: latest

  # The workflow input is the single source of truth.
  # Pull requests without workflow_dispatch inputs default to amd64.
  TARGETARCH: ${{ inputs.platform == 'arm64' && 'arm64' || 'amd64' }}

  GPU_VARIANT: ${{ inputs.gpu || 'amd' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KokoPlay ISO (${{ inputs.platform || 'amd64' }})
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE_NAME="${IMAGE_NAME,,}"

          IMAGE_REGISTRY="${IMAGE_REGISTRY,,}"

          case "${GPU_VARIANT}" in
            amd)
              ;;
            nvidia|nvidia-open)
              IMAGE_NAME="${IMAGE_NAME}-${GPU_VARIANT}"
              ;;
            *)
              echo "Unsupported GPU variant: ${GPU_VARIANT}" >&2
              exit 1
              ;;
          esac

          IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "${GITHUB_ENV}"
          echo "GPU_TAG=${GPU_VARIANT}" >> "${GITHUB_ENV}"

          echo "Target architecture: ${TARGETARCH}"
          echo "GPU variant: ${GPU_VARIANT}"
          echo "KokoPlay image: ${IMAGE_REF}"

      - name: Maximize build space
        if: env.TARGETARCH == 'amd64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "${GH_TOKEN}" | \
            sudo podman login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Pull KokoPlay image
        shell: bash
        run: |
          set -euo pipefail

          sudo podman pull \
            --platform "linux/${TARGETARCH}" \
            "${IMAGE_REF}"

      - name: Build ISO installer container
        shell: bash
        run: |
          set -euo pipefail

          sudo podman build \
            --pull=always \
            --platform "linux/${TARGETARCH}" \
            --build-arg TARGETARCH="${TARGETARCH}" \
            --build-arg KOKOPLAY_IMAGE="${IMAGE_REF}" \
            --tag localhost/kokoplay-iso-installer:latest \
            --file Containerfile.iso \
            .

      - name: Prepare Image Builder directories
        run: |
          sudo rm -rf output
          sudo mkdir -p output
          sudo mkdir -p /var/cache/image-builder/store
          sudo chmod 777 output

      - name: Build bootc generic ISO
        shell: bash
        run: |
          set -euo pipefail

          sudo podman run \
            --pull=always \
            --privileged \
            --rm \
            --volume "${GITHUB_WORKSPACE}/output:/output" \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume /var/cache/image-builder/store:/var/cache/image-builder/store \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
              --bootc-ref localhost/kokoplay-iso-installer:latest \
              --bootc-default-fs btrfs \
              --output-dir /output \
              bootc-generic-iso

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="${GITHUB_WORKSPACE}/output"

          if ! find "${SOURCE_DIR}" -type f -name '*.iso' -print -quit | grep -q .; then
            echo "No ISO file was produced." >&2
            find "${SOURCE_DIR}" -maxdepth 4 -type f
            exit 1
          fi

          find "${SOURCE_DIR}" -type f \
            ! -name "sha256.txt" \
            -print0 | sort -z | \
            xargs -0 sha256sum > "${SOURCE_DIR}/sha256.txt"

          echo "Generated files:"
          find "${SOURCE_DIR}" -type f

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: kokoplay-iso-${{ inputs.platform || 'amd64' }}-${{ inputs.gpu || 'amd' }}
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload to S3
        if: github.event_name == 'workflow_dispatch' && inputs.upload-to-s3
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ github.workspace }}/output
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y rclone

          rclone copy \
            "${SOURCE_DIR}/" \
            "S3:${{ secrets.S3_BUCKET_NAME }}/"

      - name: Upload to SourceForge
        if: github.event_name == 'workflow_dispatch' && inputs.upload-to-sf
        shell: bash
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SOURCE_DIR: ${{ github.workspace }}/output
          RELEASE_TAG: ${{ inputs.tag }}
          GPU_TAG: ${{ inputs.gpu }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

          VERSION="${RELEASE_TAG#v}"

          PROJECT_PATH="/home/frs/project/k/ko/kokoplayos/Releases/${GPU_TAG}/${VERSION}"

          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${SF_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"

          ssh-keyscan frs.sourceforge.net >> "${HOME}/.ssh/known_hosts"

          echo "Files produced by build:"
          find "${SOURCE_DIR}" -type f

          rsync -avz --progress \
            -e "ssh -i ${HOME}/.ssh/id_ed25519" \
            "${SOURCE_DIR}/" \
            "${SF_USERNAME}@frs.sourceforge.net:${PROJECT_PATH}/"