---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      title:
        description: "Release title"
        required: true
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso-kde.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest" # "ghcr.io/lorbuschris/bootc-image-builder:20250608" - see https://github.com/osbuild/bootc-image-builder/pull/954

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["anaconda-iso"] # "qcow2",
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      
      #- name: Pull kokoplay image for this platform
      #  run: |
      #    echo "Pulling ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} for platform ${{ inputs.platform }}"
      #    podman pull --platform linux/${{ inputs.platform }} ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}


     

      #- name: Debug podman images as root before
      #  run: |
      #    sudo podman images --format "table {{.Repository}}:{{.Tag}} {{.ID}} {{.Architecture}} {{.OS}}"



      #- name: Debug podman images as root
      #  run: |
      #    TAG="${{ inputs.platform }}-latest"
      #    sudo podman images --format "table {{.Repository}}:{{.Tag}} {{.ID}}"

      - name: Resolve image digest
        run: |
          DIGEST=$(skopeo inspect docker://ghcr.io/kokodroid/kokoplay:${{ inputs.platform }}-latest | jq -r .Digest)
          echo "IMAGE_WITH_DIGEST=ghcr.io/kokodroid/kokoplay@$DIGEST" >> $GITHUB_ENV

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso-kde.toml' || './disk_config/disk.toml' }}
          #image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          #image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.platform }}-latest
          image: ${{ env.IMAGE_WITH_DIGEST }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs=btrfs 
          #pull: true

      # ✅ NEW: Upload ISO artifact
      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: kokoplay-iso
          path: |
            output/bootiso/install.iso
            output/manifest-anaconda-iso.json



      #- name: Upload disk images and Checksum to Job Artifacts
      #  if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
      #  uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      #  with:
      #    path: ${{ steps.build.outputs.output-directory }}
      #    if-no-files-found: error
      #    retention-days: 0
      #    compression-level: 0
      #    overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
  
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ✅ REQUIRED
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # REQUIRED for tag creation

      - name: Download ISO artifact
        uses: actions/download-artifact@v7
        with:
          name: kokoplay-iso
          path: release
      
      - name: Debug artifact contents
        run: |
          echo "=== release tree ==="
          find release -maxdepth 4 -type f

      - name: Generate SHA256SUMS
        run: |
         cd release
         ISO=$(find . -name '*.iso' | head -n 1)

         if [ -z "$ISO" ]; then
           echo "❌ No ISO found in artifact"
           exit 1
         fi

         echo "Found ISO: $ISO"
         sha256sum "$ISO" > SHA256SUMS
         cat SHA256SUMS

        # ✅ CREATE TAG
      - name: Create git tag
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Debug release files 2
        run: |
          echo "PWD=$(pwd)"
          echo "=== RELEASE TREE ==="
          find release -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          body: |
            KoKoPlay OS ISO release.

            ### Integrity check
            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            release/**/*.iso
            release/**/*.json
            release/SHA256SUMS         

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}